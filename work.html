<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SKETCHBOOK</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>

  <div class="fx" aria-hidden="true">
    <div class="fx__grain"></div>
    <div class="fx__scan"></div>
    <div class="fx__vig"></div>
    <div class="fx__flicker"></div>
  </div>

  <div class="cursor" id="cursor" aria-hidden="true">
    <i class="cursor__x"></i>
    <i class="cursor__y"></i>
    <i class="cursor__dot"></i>
    <span class="cursor__label"></span>
  </div>

  <div class="hud" aria-hidden="true">
    <span class="hud__tl" id="hud-time">--:--:-- UTC</span>
    <span class="hud__tr" id="hud-session">SESSION ------</span>
    <span class="hud__bl">SKETCHBOOK &copy;</span>
    <span class="hud__br" id="hud-scroll">000%</span>
  </div>

  <main class="page">
    <div class="detail">

      <nav class="detail__nav">
        <a href="index.html" data-cursor="BACK">&larr; index</a>
        <span id="caption-id">SKB&mdash;000</span>
      </nav>

      <div class="stage" id="stage">
        <i class="mark"></i>
        <div class="stage__box" id="stage-box">
          <div class="stage__loading">ESTABLISHING CONNECTION&hellip;</div>
        </div>
      </div>

      <section class="caption">
        <div class="caption__id">WORK</div>
        <div>
          <h2 id="caption-title">&nbsp;</h2>
          <p id="caption-desc"></p>
          <a class="caption__open" id="caption-open" href="#" target="_blank" rel="noopener" data-cursor="FULL">open full &rarr;</a>
        </div>
      </section>

      <footer class="foot">
        <a id="contact" href="#">CONTACT</a>
      </footer>

    </div>
  </main>

  <script src="works.js"></script>
  <script src="assets/app.js"></script>
  <script>
    (function () {
      var el = document.getElementById("contact");
      if (el && typeof CONTACT !== "undefined") {
        el.textContent = CONTACT.label;
        el.setAttribute("href", CONTACT.href);
        el.setAttribute("data-cursor", "MAIL");
      }
    })();
  </script>
</body>
</html>
