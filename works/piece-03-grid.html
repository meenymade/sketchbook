<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mesh</title>
<style>
  html, body{ margin:0; height:100%; background:#17181C; overflow:hidden; }
  canvas{ display:block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let w, h;
  function resize(){
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  const spacing = 36;
  let mouse = { x: w / 2, y: h / 2 };
  window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
  window.addEventListener('touchmove', e => {
    mouse.x = e.touches[0].clientX;
    mouse.y = e.touches[0].clientY;
  });

  function draw(){
    ctx.clearRect(0, 0, w, h);
    ctx.strokeStyle = 'rgba(241,239,233,0.35)';
    ctx.lineWidth = 1;

    const cols = Math.ceil(w / spacing) + 1;
    const rows = Math.ceil(h / spacing) + 1;
    const points = [];

    for(let j = 0; j < rows; j++){
      points.push([]);
      for(let i = 0; i < cols; i++){
        const x = i * spacing;
        const y = j * spacing;
        const dx = mouse.x - x;
        const dy = mouse.y - y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        const force = Math.max(0, 1 - dist / 220);
        points[j].push({
          x: x - dx * force * 0.35,
          y: y - dy * force * 0.35
        });
      }
    }

    for(let j = 0; j < rows; j++){
      ctx.beginPath();
      points[j].forEach((p, i) => i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
      ctx.stroke();
    }
    for(let i = 0; i < cols; i++){
      ctx.beginPath();
      points.forEach((row, j) => j === 0 ? ctx.moveTo(row[i].x, row[i].y) : ctx.lineTo(row[i].x, row[i].y));
      ctx.stroke();
    }

    requestAnimationFrame(draw);
  }
  draw();
</script>
</body>
</html>
