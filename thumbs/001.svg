<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <defs>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <filter id="bands">
      <feTurbulence type="fractalNoise" baseFrequency="0.003 0.1" numOctaves="5" seed="7"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
    </filter>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6a6a6a"/>
      <stop offset="55%" stop-color="#4a4a4a"/>
      <stop offset="100%" stop-color="#181818"/>
    </linearGradient>
  </defs>
  <rect width="1440" height="900" fill="url(#sky)"/>
  <rect width="1440" height="900" filter="url(#bands)" opacity="0.5"/>
  <rect y="822" width="1440" height="78" fill="#0d0d0d"/>
  <rect width="1440" height="900" filter="url(#grain)" opacity="0.24"/>
</svg>
